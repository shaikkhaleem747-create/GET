{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        GET - Create Group
    </title>

    <link
        rel="stylesheet"
        href="{% static 'users/style.css' %}"
    >

</head>

<body>

<header class="navbar">

    <div class="logo">
        GET
    </div>

    <nav>

        <a href="{% url 'home' %}">
            Home
        </a>

        <a href="{% url 'explore' %}">
            Explore
        </a>

        <a href="{% url 'messages' %}">
            Messages
        </a>

        <a href="{% url 'notifications' %}">
            🔔 Notifications
        </a>

        <a href="{% url 'profile' %}">
            Profile
        </a>

        <a href="{% url 'logout' %}">
            Logout
        </a>

    </nav>

</header>


<main>

    <div class="profile-card">

        <h1>
            Create Group
        </h1>


        <form
            method="POST"
            class="group-form"
        >

            {% csrf_token %}


            <label>
                Group name
            </label>

            <input
                type="text"
                name="name"
                maxlength="100"
                placeholder="Enter group name"
                required
            >


            <label>
                Who can add people?
            </label>

            <select
                name="add_permission"
            >

                {% for value, label in permission_choices %}

                    <option
                        value="{{ value }}"
                    >
                        {{ label }}
                    </option>

                {% endfor %}

            </select>


            <div class="profile-actions">

                <button
                    type="submit"
                    class="register-btn"
                >
                    Create Group
                </button>

                <a
                    href="{% url 'messages' %}"
                    class="message-btn"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</main>

</body>

</html>
